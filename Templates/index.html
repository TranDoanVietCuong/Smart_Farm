<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrinova AI Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 p-8 font-sans">
    <div class="max-w-5xl mx-auto space-y-6">
        
        <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-green-500">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Agrinova AI Control Center</h1>
            <div class="flex items-center gap-2 mt-4 p-3 bg-green-50 rounded-lg text-green-800">
                <span class="text-2xl">🧠</span>
                <div>
                    <p class="text-sm font-semibold uppercase tracking-wide">Nhận định từ AI</p>
                    <p class="text-lg font-medium" id="ai_scenario">Đang chờ dữ liệu...</p>
                    <p class="text-sm mt-1" id="ai_water">Lượng nước dự kiến: -- ml</p>
                </div>
            </div>
        </div>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl text-center shadow-sm border border-gray-100">
                <p class="text-gray-500 text-sm font-bold uppercase">Độ Ẩm Đất</p>
                <p class="text-3xl font-black text-blue-500 mt-2" id="soil_moist">-- %</p>
            </div>
            <div class="bg-white p-4 rounded-xl text-center shadow-sm border border-gray-100">
                <p class="text-gray-500 text-sm font-bold uppercase">Nhiệt Độ</p>
                <p class="text-3xl font-black text-red-500 mt-2" id="temp">-- °C</p>
            </div>
            <div class="bg-white p-4 rounded-xl text-center shadow-sm border border-gray-100">
                <p class="text-gray-500 text-sm font-bold uppercase">Ẩm Không Khí</p>
                <p class="text-3xl font-black text-indigo-500 mt-2" id="air_hum">-- %</p>
            </div>
            <div class="bg-white p-4 rounded-xl text-center shadow-sm border border-gray-100">
                <p class="text-gray-500 text-sm font-bold uppercase">Ánh Sáng</p>
                <p class="text-3xl font-black text-yellow-500 mt-2" id="light">--</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-xl font-bold text-gray-700 mb-4">Biểu Đồ Môi Trường (Real-time)</h2>
                <canvas id="sensorChart" height="120"></canvas>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-md flex flex-col gap-4">
                <h2 class="text-xl font-bold text-gray-700 mb-2">Tương Tác Thủ Công</h2>
                <button onclick="sendCommand('PUMP_ON')" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-200">
                    💦 Bật Bơm Nước
                </button>
                <button onclick="sendCommand('PUMP_OFF')" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-200">
                    🚫 Ngắt Bơm
                </button>
                <button onclick="sendCommand('NET_CLOSE')" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-200">
                    ☀️ Kéo Lưới Che Nắng
                </button>
                <button onclick="sendCommand('NET_OPEN')" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-200">
                    🌤️ Thu Lưới Vào
                </button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();

        const ctx = document.getElementById('sensorChart').getContext('2d');
        const sensorChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], 
                datasets: [
                    { label: 'Độ ẩm đất (%)', borderColor: 'rgb(59, 130, 246)', backgroundColor: 'rgba(59, 130, 246, 0.1)', data: [], tension: 0.4, fill: true },
                    { label: 'Nhiệt độ (°C)', borderColor: 'rgb(239, 68, 68)', backgroundColor: 'transparent', data: [], tension: 0.4 }
                ]
            },
            options: { responsive: true, animation: false, scales: { y: { beginAtZero: true, max: 100 } } }
        });

        socket.on('update_dashboard', function(data) {
            if (data.sensors) {
                document.getElementById('soil_moist').innerText = data.sensors.do_am_dat + ' %';
                document.getElementById('temp').innerText = data.sensors.nhiet_do + ' °C';
                document.getElementById('air_hum').innerText = data.sensors.do_am_kk + ' %';
                document.getElementById('light').innerText = data.sensors.anh_sang;

                const now = new Date().toLocaleTimeString();
                sensorChart.data.labels.push(now);
                sensorChart.data.datasets[0].data.push(data.sensors.do_am_dat);
                sensorChart.data.datasets[1].data.push(data.sensors.nhiet_do);

                if(sensorChart.data.labels.length > 20) {
                    sensorChart.data.labels.shift();
                    sensorChart.data.datasets[0].data.shift();
                    sensorChart.data.datasets[1].data.shift();
                }
                sensorChart.update();
            }
            if (data.ai_status) {
                document.getElementById('ai_scenario').innerText = data.ai_status.scenario;
                document.getElementById('ai_water').innerText = `Lượng nước dự kiến bơm: ${data.ai_status.predicted_water} ml`;
            }
        });

        function sendCommand(actionType) {
            fetch('/api/control', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: actionType }) })
            .then(res => res.json()).then(data => alert(data.message)).catch(err => console.error(err));
        }
    </script>
</body>
</html>
